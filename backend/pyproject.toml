[project]
name = "avito-reviewer"
version = "0.1.0"
description = "Avito AI Reviewer backend — ingestion, review and AI-detection services"
authors = [
    { name = "kdduha", email = "just.andrew.kd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "arq>=0.26",
    "asyncpg>=0.29",
    "fastapi>=0.141.1",
    "githubkit>=0.16.1",
    "httpx>=0.28",
    "nbformat>=5.11.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.9",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "unidiff>=1.0.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
    "aiosqlite>=0.20",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# Длина строки под существующий код: он писался в 100, а не в 88.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # длину строк держим глазами: докстринги здесь несут аргументацию
    "UP042",   # (str, Enum) -> StrEnum меняет результат str() у членов; отдельная задача
    "C408",    # dict(...) в фабриках тестов — осознанная идиома, не описка
    "RUF100",  # в коде есть noqa на правила шире этого набора (BLE001, N802):
               # они объясняют, почему код такой, и снимать их значит терять довод
    "RUF001",  # кириллица в строках и докстрингах — язык проекта, а не гомоглифы
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Тесты и скрипты правят sys.path до импортов — иначе фабрики рядом не видны.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
# Строгость наращивается по мере готовности: сейчас проверяются тела функций,
# которые уже типизированы, а требовать аннотации на каждую (`disallow_untyped_defs`)
# рано — тесты и скрипты в files не входят вовсе.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
