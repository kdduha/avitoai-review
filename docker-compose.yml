services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      INGEST_GITHUB__TOKEN: ${INGEST_GITHUB__TOKEN:-}
      # Без ключа поднимается провайдер `fake`: весь путь проходится,
      # модель не вызывается.
      AI_LLM__PROVIDER: ${AI_LLM__PROVIDER:-fake}
      AI_LLM__API_KEY: ${AI_LLM__API_KEY:-}
      AI_LLM__BASE_URL: ${AI_LLM__BASE_URL:-https://api.aitunnel.ru/v1}
      AI_LLM__MODEL: ${AI_LLM__MODEL:-deepseek-v4-flash}
      AI_LLM__LOCAL_BASE_URL: ${AI_LLM__LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_LLM__FORCE_LOCAL: ${AI_LLM__FORCE_LOCAL:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
