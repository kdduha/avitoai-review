server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # То же, что делает vite.config.ts в dev: /api/foo -> backend:8000/foo.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Дефолтные 60s nginx короче, чем настоящий /review: несколько батчей
        # критериев плюс детектор, каждый — вызов внешней модели с retry на
        # обрезанном JSON (до 4 попыток, см. handover-backend.md). На `fake`
        # не заметно, на реальном ключе получали 504 раньше, чем бэкенд
        # успевал ответить.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # SPA: маршруты React Router не существуют как файлы на диске.
    location / {
        try_files $uri /index.html;
    }
}
