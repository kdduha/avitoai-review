[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avitoai-review"
version = "0.1.0"
description = "Ревью-агент и детектор признаков ГенИИ для AI-помощника ревьюера Авито"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Ядро разрабатывается отдельно; сервисы работают с ним по структурным
# протоколам из contracts.py и не импортируют его напрямую.
core = ["reviewer-core>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
